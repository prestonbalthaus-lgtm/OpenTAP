[package]
name = "otap-control"
description = "OpenTAP's control protocol between dbladed and otapctl (Step 5, E38): the request and reply types, their length-prefixed JSON framing, the endpoint syntax (a Unix socket on Linux, loopback TCP anywhere) and a blocking client. No sockets are opened here except by the client; no unsafe code."
